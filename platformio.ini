[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600   ; match Serial.begin() in src/main.cpp — pio device monitor reads real text
build_flags = -D FASTLED_ESP32_I2S=1   ; I2S DMA clockless driver: CPU hands off a buffer, no per-item IRQ servicing during show()
lib_deps =
  fastled/FastLED@^3.10.3
